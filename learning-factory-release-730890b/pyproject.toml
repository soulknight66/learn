[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-factory"
version = "0.1.0"
description = "A deterministic control plane for producing validated computer-science learning artifacts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
learnfactory = "learnfactory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
