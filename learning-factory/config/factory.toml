[factory]
database = "warehouse/factory.db"
warehouse = "warehouse"
lease_seconds = 120
heartbeat_seconds = 5
database_busy_timeout_seconds = 60
poll_seconds = 0.25
max_concurrency = 12
allow_host_command_validators = false
course_revision_limit = 2
shutdown_grace_seconds = 10

[backend]
name = "exec"
command = "codex"
permission_profile = "factory-isolated"
toolchain_read_roots = [
  "/arm/tools/python/python/3.11.5/rhe8-x86_64",
  "/arm/tools/adoptopenjdk/openjdk/21.0.5_11/linux64/jdk-21.0.5+11",
  "/arm/tools/arm/arm-gnu-toolchain-arm-none-eabi/15.2.rel1/linux64",
  "/arm/tools/qemu/qemu/9.1.1/linux64",
  "/arm/tools/gnu/glib/2.82.1/rhe8-x86_64/lib64",
  "/arm/tools/nodejs/node/22.21.0/linux64/bin/node",
  "/arm/tools/google/golang/1.27.0/linux64",
  "/arm/tools/arm/arm-gnu-toolchain-aarch64-none-elf/15.2.rel1/linux64",
  "/arm/tools/nasm/nasm/2.16.03/rhe8-x86_64/bin/nasm",
  "/arm/tools/gnu/gcc/15.2.0/rhe8-x86_64",
  "/arm/tools/gnu/binutils/2.43/rhe8-x86_64",
  "/arm/tools/gnu/flex/2.6.4/rhe7-x86_64",
  "/arm/tools/gnu/bison/3.6.2/rhe8-x86_64",
]
timeout_seconds = 1800
model = "gpt-5.6-sol"
reasoning_effort = "ultra"
provider = "arm"
provider_name = "ARM OpenAI Proxy"
base_url = "https://openai-api-proxy.geo.arm.com/api/providers/openai/v1"
requires_openai_auth = true
supports_websockets = false

[limits]
ingestion = 1
course_manager = 3
student = 2
examiner = 3
reference_builder = 5
productionizer = 2
synthesizer = 2
maintenance = 1

[retry]
base_seconds = 2
max_seconds = 300
